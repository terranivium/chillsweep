[[rule]]
id = 'browser-caches'
name = 'Browser caches'
paths = [
  '%CACHE%/Google/Chrome/*/Cache',
  '%CACHE%/Google/Chrome/*/Code Cache',
  '%CACHE%/com.apple.Safari',
  '%CACHE%/Firefox/Profiles/*/cache2',
  '%CACHE%/BraveSoftware/Brave-Browser/*/Cache',
  '%CACHE%/Microsoft Edge/*/Cache',
]
tier = 'safe'
category = 'cache'
what = 'Copies of web pages, images and scripts browsers keep to load sites faster.'
