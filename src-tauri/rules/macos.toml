tier = 'leftover'
category = 'leftover'
what = 'Settings, indexes and caches from JetBrains IDEs.'
if_deleted = 'Nothing, unless you reinstall one and want your old settings back.'

[[rule]]
id = 'unity-leftovers'
name = 'Unity leftovers'
paths = ['%CONFIG%/Unity', '%CACHE%/Unity', '%CONFIG%/UnityHub', '%CACHE%/com.unity3d.unityhub']
owner = ['Unity', 'Unity Hub']
owner_exe = ['Unity', 'Unity Hub']
tier = 'leftover'
category = 'leftover'
what = 'Licences, caches and editor settings from Unity and Unity Hub.'
if_deleted = 'Nothing, unless you reinstall Unity. You may need to sign in again.'

[[rule]]
id = 'adobe-leftovers'
name = 'Adobe leftovers'
paths = ['%CONFIG%/Adobe', '%CACHE%/Adobe', '%LOGS%/Adobe']
owner = ['Adobe']
owner_exe = ['Adobe Creative Cloud', 'Adobe Desktop Service', 'Photoshop', 'Illustrator', 'Premiere Pro', 'After Effects', 'InDesign', 'Lightroom']
tier = 'leftover'
category = 'leftover'
what = 'Settings, caches and logs from Adobe apps and Creative Cloud.'
if_deleted = "Nothing, unless you reinstall an Adobe app and want its old preferences and presets back."

[[rule]]
id = 'steam-leftovers'
name = 'Steam leftovers'
paths = ['%CONFIG%/Steam/appcache', '%CONFIG%/Steam/logs', '%CONFIG%/Steam/depotcache']
owner = ['Steam']
owner_exe = ['steam_osx', 'Steam']
tier = 'safe'
category = 'games'
what = "Steam's own caches and logs, separate from your installed games."
if_deleted = 'Steam rebuilds them the next time it starts. Your games and saves are not affected.'

[[rule]]
id = 'spotify-cache'
name = 'Spotify cache'
paths = ['%CACHE%/com.spotify.client', '%CONFIG%/Spotify/PersistentCache']
owner = ['Spotify']
owner_exe = ['Spotify']
tier = 'safe'
category = 'cache'
what = 'Audio Spotify has cached so it can play tracks without streaming them again.'
if_deleted = 'Tracks stream again the next time you play them. Downloads marked for offline use are re-downloaded.'

[[rule]]
id = 'slack-cache'
name = 'Slack cache'
paths = ['%CONFIG%/Slack/Cache', '%CONFIG%/Slack/Code Cache', '%CONFIG%/Slack/Service Worker/CacheStorage']
owner = ['Slack']
owner_exe = ['Slack']
tier = 'safe'
category = 'cache'
what = 'Images, files and web content Slack keeps to load conversations faster.'
if_deleted = 'Slack re-downloads what it needs. Your messages are on the server and are not affected.'

[[rule]]
id = 'discord-cache'
name = 'Discord cache'
paths = ['%CONFIG%/discord/Cache', '%CONFIG%/discord/Code Cache', '%CONFIG%/discord/GPUCache']
owner = ['Discord']
owner_exe = ['Discord']
tier = 'safe'
category = 'cache'
what = 'Images and web content Discord keeps to load servers faster.'
if_deleted = 'Discord re-downloads what it needs. Your messages are not affected.'

[[rule]]
id = 'zoom-leftovers'
name = 'Zoom leftovers'
paths = ['%CONFIG%/zoom.us', '%CACHE%/us.zoom.xos', '%LOGS%/zoom.us']
owner = ['Zoom', 'zoom.us']
owner_exe = ['zoom.us']
tier = 'leftover'
category = 'leftover'
what = 'Settings, caches and logs from Zoom.'
if_deleted = 'Nothing, unless you reinstall Zoom and want your old settings back. Saved recordings live in your home folder and are not affected.'

[[rule]]
id = 'electron-updater-cache'
name = 'App update downloads'
paths = ['%CACHE%/*-updater', '%CACHE%/*.ShipIt']
tier = 'safe'
category = 'temp'
what = 'Installers apps downloaded to update themselves, kept after the update finished.'
if_deleted = 'Nothing. An app downloads a fresh copy next time it updates.'

[[rule]]
id = 'wine-crossover-leftovers'
name = 'Wine and CrossOver leftovers'
paths = ['%CONFIG%/CrossOver', '%USERPROFILE%/.wine']
owner = ['CrossOver', 'Wine']
owner_exe = ['CrossOver', 'wine']
tier = 'leftover'
category = 'games'
what = 'Windows compatibility bottles and their installed programs.'
if_deleted = 'Anything installed inside a bottle is gone, including its settings and saves.'

# ---------------------------------------------------------------------------
# Large derived caches. The model for these is Windows' D3DSCache entry: big, entirely
# rebuildable, and in a place nobody would think to look. A rule for software that isn't
# installed resolves to nothing and costs nothing, so breadth here is close to free — the care
# goes into the tier and the "if you remove it" line, not into whether the path exists.
# ---------------------------------------------------------------------------

[[rule]]
id = 'adobe-media-cache'
name = 'Adobe media cache'
paths = ['%CONFIG%/Adobe/Common/Media Cache Files', '%CONFIG%/Adobe/Common/Media Cache']
tier = 'safe'
category = 'cache'
what = 'Conformed audio and peak files Premiere and After Effects generate for every clip you import. Usually the largest thing Adobe leaves on a disk.'
if_deleted = 'Premiere and After Effects reconform footage as you open each project, which takes a few moments per clip. No project or media is affected.'

[[rule]]
id = 'after-effects-disk-cache'
name = 'After Effects disk cache'
paths = ['%CACHE%/Adobe/After Effects/*/*Disk Cache*', '%CONFIG%/Adobe/Common/AE Disk Cache*']
tier = 'safe'
category = 'cache'
what = 'Rendered frames After Effects keeps so it can play a composition back without rendering it again.'
if_deleted = 'Previews render again the next time you play a composition.'

[[rule]]
id = 'adobe-scratch'
name = 'Photoshop scratch and recovery files'
paths = ['%CONFIG%/Adobe/Adobe Photoshop */AutoRecover', '%TEMP%/Photoshop Temp*']
tier = 'your_call'
category = 'temp'
what = 'Photoshop scratch files and automatically recovered documents. Scratch files are left behind when Photoshop crashes and can run to many gigabytes.'
if_deleted = 'Anything Photoshop recovered but you have not reopened and saved is lost. Check Photoshop for recovered documents first.'

[[rule]]
id = 'simulator-devices'
name = 'Simulator devices'
paths = ['%LIBRARY%/Developer/CoreSimulator/Devices']
tier = 'your_call'
category = 'dev'
what = 'Every simulated iPhone, iPad and Watch Xcode has created, with the apps and data installed on each. Several gigabytes per device.'
if_deleted = 'The simulated devices and anything installed on them are gone. Xcode recreates devices on demand, but app data and logged-in states are lost. `xcrun simctl delete unavailable` removes only the obsolete ones.'

[[rule]]
id = 'unreal-ddc'
name = 'Unreal engine cache'
paths = ['%CONFIG%/Epic/UnrealEngine/*/DerivedDataCache', '%CONFIG%/Epic/UnrealEngine/Common/DerivedDataCache', '%CACHE%/Epic']
tier = 'safe'
category = 'games'
what = 'Shaders and cooked assets Unreal shares between projects.'
if_deleted = 'Unreal rebuilds what it needs the next time you open a project. The first load is slow.'

[[rule]]
id = 'unity-shared-cache'
name = 'Unity shared cache'
paths = ['%LIBRARY%/Unity/cache', '%CACHE%/com.unity3d.UnityEditor', '%CONFIG%/Unity/cache']
tier = 'safe'
category = 'games'
what = 'Packages and imported assets Unity caches across all your projects.'
if_deleted = 'Unity downloads and reimports what it needs. Projects are unaffected.'

[[rule]]
id = 'android-emulators'
name = 'Android emulator images'
paths = ['%LIBRARY%/Android/sdk/system-images', '%USERPROFILE%/.android/avd']
tier = 'your_call'
category = 'dev'
what = 'Full Android system images and the virtual devices built from them. Several gigabytes each.'
if_deleted = 'The virtual devices and their installed apps and data are gone. Android Studio can download the images again.'

[[rule]]
id = 'node-tool-caches'
name = 'JavaScript tool caches'
paths = [
  '%LIBRARY%/pnpm/store',
  '%USERPROFILE%/.bun/install/cache',
  '%CACHE%/Cypress',
  '%CACHE%/puppeteer',
  '%CACHE%/electron',
  '%CACHE%/electron-builder',
  '%CACHE%/node-gyp',
  '%CACHE%/typescript',
]
tier = 'safe'
category = 'dev'
what = 'Packages, browser builds and prebuilt binaries that JavaScript tooling keeps so it can install them again without downloading.'
if_deleted = 'The next install or test run downloads what it needs again.'

[[rule]]
id = 'python-tool-caches'
name = 'Python tool caches'
paths = ['%CACHE%/pypoetry', '%USERPROFILE%/.cache/uv', '%USERPROFILE%/.conda/pkgs', '%USERPROFILE%/.cache/pre-commit']
tier = 'safe'
category = 'dev'
what = 'Downloaded packages and build artefacts kept by Poetry, uv, conda and pre-commit.'
if_deleted = 'The next install downloads them again.'

[[rule]]
id = 'other-lang-caches'
name = 'Other language caches'
paths = ['%USERPROFILE%/go/pkg/mod', '%USERPROFILE%/.m2/repository', '%USERPROFILE%/.pub-cache', '%USERPROFILE%/.ivy2/cache', '%USERPROFILE%/.sbt']
tier = 'your_call'
category = 'dev'
what = 'Downloaded dependencies for Go, Maven, Dart/Flutter, Ivy and sbt projects.'
if_deleted = 'Your next build downloads them again, which needs a working network and can take a while on a big project.'

[[rule]]
id = 'teams-cache'
name = 'Microsoft Teams cache'
paths = ['%CONFIG%/Microsoft/Teams/Cache', '%CONFIG%/Microsoft/Teams/Code Cache', '%CONFIG%/Microsoft/Teams/GPUCache', '%CACHE%/com.microsoft.teams']
owner = ['Microsoft Teams']
owner_exe = ['Microsoft Teams']
tier = 'safe'
category = 'cache'
what = 'Images, files and web content Teams keeps to load conversations faster.'
if_deleted = 'Teams re-downloads what it needs. Your messages live on the server.'

[[rule]]
id = 'apple-app-caches'
name = 'System service caches'
paths = ['%CACHE%/com.apple.appstore', '%CACHE%/com.apple.helpd', '%CACHE%/com.apple.iTunes', '%CACHE%/com.apple.akd', '%CACHE%/com.apple.Safari/WebKitCache']
tier = 'safe'
category = 'cache'
what = "Caches belonging to the App Store, Help Viewer and other built-in services."
if_deleted = 'Rebuilt automatically as you use each service.'
