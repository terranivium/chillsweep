# Config for `npm run notices`, which regenerates src/third-party-notices.txt from the crates that
# actually ship in the Windows build. It needs cargo-about: cargo install cargo-about --locked --features cli
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "BSL-1.0",
]
# The notices file ships in both bundles, so it has to be the union of both platforms'
# dependency closures: macOS pulls in plist and the objc2 crates, Windows pulls in winreg and
# windows-sys. One machine can generate all three.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
