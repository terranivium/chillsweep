owner = ['Cursor']
owner_exe = ['Cursor']
tier = 'leftover'
category = 'leftover'
what = 'Settings, extensions and workspace state from the Cursor editor.'
if_deleted = 'Nothing, unless you reinstall it and want your old settings back.'

[[rule]]
id = 'jetbrains-leftovers'
