[[rule]]
id = 'windows-error-reports'
name = 'Windows error reports'
paths = ['%LOCALAPPDATA%\Microsoft\Windows\WER\ReportArchive', '%LOCALAPPDATA%\Microsoft\Windows\WER\ReportQueue', '%LOCALAPPDATA%\CrashDumps']
tier = 'safe'
category = 'cache'
what = 'Crash reports and memory dumps from programs that crashed.'
if_deleted = 'Nothing is lost unless you are debugging a crash.'

[[rule]]
id = 'squirrel-temp'
name = 'Installer temp files'
paths = ['%LOCALAPPDATA%\SquirrelTemp']
tier = 'safe'
category = 'temp'
what = 'Temporary files from app installers that use Squirrel (Discord, Slack, Teams and others).'
if_deleted = 'Nothing; they are only used during an install.'

[[rule]]
id = 'dotnet-telemetry'
name = '.NET telemetry queue'
paths = ['%USERPROFILE%\.dotnet\TelemetryStorageService']
tier = 'safe'
category = 'dev'
what = 'Usage data the .NET SDK queued to send to Microsoft.'
if_deleted = 'Nothing.'

[[rule]]
id = 'browser-caches'
name = 'Browser caches'
paths = [
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache',
  '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache',
  '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Cache',
  '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2',
  '%LOCALAPPDATA%\librewolf\Profiles\*\cache2',
]
tier = 'safe'
category = 'cache'
what = 'Copies of web pages, images and scripts browsers keep to load sites faster.'
if_deleted = 'Sites load a little slower the first time. Logins, history and bookmarks are not affected.'

# ---------------------------------------------------------------------------
# Known leftovers (tier = leftover). Flagged only when none of `owner` is installed.
# These add names and wording; the general "no installed owner" signal would still
# find most of them without a rule.
# ---------------------------------------------------------------------------

[[rule]]
id = 'docker-leftovers'
name = 'Docker Desktop leftovers'
paths = ['%USERPROFILE%\.docker', '%LOCALAPPDATA%\Docker', '%APPDATA%\Docker', '%APPDATA%\Docker Desktop', '%LOCALAPPDATA%\docker-secrets-engine']
owner = ['Docker Desktop']
owner_exe = ['docker', 'Docker Desktop']
tier = 'leftover'
category = 'leftover'
what = 'Settings, CLI plugins and cached data from Docker Desktop.'
if_deleted = 'Nothing, unless you reinstall Docker and want your old settings back.'

[[rule]]
id = 'conda-leftovers'
name = 'Conda (Anaconda/Miniconda) leftovers'
paths = ['%USERPROFILE%\.conda', '%LOCALAPPDATA%\conda', '%USERPROFILE%\.condarc']
owner = ['Anaconda', 'Miniconda', 'Miniforge', 'Mambaforge']
owner_exe = ['conda', 'mamba']
