[[rule]]
id = 'quicklook-cache'
name = 'Quick Look thumbnails'
paths = ['%CACHE%/com.apple.QuickLook.thumbnailcache']
tier = 'safe'
category = 'cache'
what = 'Preview thumbnails macOS generates for files in Finder.'
if_deleted = 'Finder regenerates a preview the next time you look at a folder.'

[[rule]]
id = 'metal-shader-cache'
name = 'Graphics shader cache'
paths = ['%CACHE%/com.apple.metal', '%CACHE%/com.apple.metalfe']
tier = 'safe'
category = 'games'
what = "macOS' cache of compiled graphics shaders."
if_deleted = 'Rebuilt automatically as games and apps run. The first few seconds after launch may stutter once.'

[[rule]]
id = 'saved-app-state'
name = 'Reopened window state'
paths = ['%SAVEDSTATE%']
tier = 'safe'
category = 'cache'
what = 'What each app had open last time, so it can restore its windows when you reopen it.'
if_deleted = 'Apps open with fresh windows instead of restoring your last session.'

[[rule]]
id = 'app-logs'
name = 'App logs'
paths = ['%LOGS%']
tier = 'safe'
category = 'cache'
what = 'Diagnostic logs apps write about their own activity.'
if_deleted = 'Nothing, unless you are in the middle of sending a bug report that asks for them.'

[[rule]]
id = 'crashreporter-logs'
name = 'Crash reports'
paths = ['%LOGS%/DiagnosticReports']
tier = 'safe'
category = 'cache'
what = 'Reports macOS writes when an app crashes.'
if_deleted = 'Nothing, unless you are about to send one to a developer.'

[[rule]]
id = 'ios-backups'
name = 'iPhone and iPad backups'
paths = ['%CONFIG%/MobileSync/Backup']
tier = 'your_call'
category = 'leftover'
what = 'Full local backups of iPhones and iPads made by Finder. Usually many gigabytes each.'
if_deleted = "You lose the ability to restore a device from a local backup. If you also back up to iCloud, that copy is unaffected. Check the dates before removing anything."

[[rule]]
id = 'xcode-archives'
name = 'Xcode archives'
paths = ['%LIBRARY%/Developer/Xcode/Archives']
tier = 'your_call'
category = 'dev'
what = 'Built and signed copies of apps you have archived for distribution, with their debug symbols.'
if_deleted = "You lose the ability to symbolicate crash reports from those exact builds, and you cannot re-upload a build without rebuilding it."

# ---------------------------------------------------------------------------
# Known leftovers (tier = leftover). Only flagged when the owner is gone.
# ---------------------------------------------------------------------------

[[rule]]
id = 'docker-leftovers'
