owner_exe = ['Docker', 'docker', 'com.docker.backend']
tier = 'leftover'
category = 'leftover'
what = 'Settings, CLI plugins and cached data from Docker Desktop.'
if_deleted = 'Nothing, unless you reinstall Docker and want your old settings back.'

[[rule]]
id = 'vscode-leftovers'
name = 'Visual Studio Code leftovers'
paths = ['%CONFIG%/Code', '%USERPROFILE%/.vscode']
owner = ['Visual Studio Code', 'Code']
owner_exe = ['Code']
tier = 'leftover'
category = 'leftover'
what = 'Settings, extensions and workspace state from Visual Studio Code.'
if_deleted = 'Nothing, unless you reinstall it and want your old settings and extensions back.'

[[rule]]
id = 'cursor-leftovers'
