[package]
name = "leftover"
version = "0.1.0"
description = "Finds leftovers from uninstalled apps, caches, and dev/game clutter on Windows"
authors = ["Wesley Scott"]
edition = "2021"
default-run = "leftover"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "leftover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "leftover-scan"
path = "src/bin/scan.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
winreg = "0.56"
rayon = "1"
regex = "1"
ignore = "0.4"
sysinfo = "0.39"
trash = "5"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
